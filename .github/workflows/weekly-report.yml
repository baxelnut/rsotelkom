name: Weekly report

on:
  schedule:
    - cron: "0 2 * * 2" # Selasa 09:00 WIB
  workflow_dispatch:

jobs:
  weekly:
    runs-on: ubuntu-latest
    environment: Workflow ENV
    steps:
      - name: Check secrets
        run: |
          [ -n "${{ secrets.API_URL }}" ] || { echo "API_URL is empty"; exit 1; }
          [ -n "${{ secrets.SYNC_SECRET }}" ] || { echo "SYNC_SECRET is empty"; exit 1; }
      - name: Post weekly report to channel
        run: |
          curl --fail-with-body -sS -X POST \
            "${{ secrets.API_URL }}/api/telegram/weekly" \
            -H "x-sync-secret: ${{ secrets.SYNC_SECRET }}"
