name: Send alert report

on:
  workflow_dispatch:

jobs:
  alert:
    runs-on: ubuntu-latest
    environment: Workflow ENV
    steps:
      - name: Check secrets
        run: |
          [ -n "${{ secrets.API_URL }}" ] || { echo "API_URL is empty"; exit 1; }
          [ -n "${{ secrets.SYNC_SECRET }}" ] || { echo "SYNC_SECRET is empty"; exit 1; }
      - name: Post alert to channel
        run: |
          curl --fail-with-body -sS -X POST \
            "${{ secrets.API_URL }}/api/telegram/alert" \
            -H "x-sync-secret: ${{ secrets.SYNC_SECRET }}"
